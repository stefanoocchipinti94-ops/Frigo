<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<meta name="theme-color" content="#F4F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dispensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: colonna da telefono (max 560px). Header con saluto personale + menu a tendina; mascotte Frigo che cambia umore;
   barra in basso a 5 posti con il "+" centrale; chef sempre raggiungibile in una bolla flottante. */
:root{
  --bg:#F4F2EA; --card:#FFFFFF; --ink:#2B221D; --muted:#7A6D62; --line:#E7E1D3; --line-strong:#D0C6B2;
  --acc:#E2452B; --on-acc:#FFFFFF;
  --tomato:#E2452B; --basil:#2D8753; --lemon:#D9A514; --orange:#EC8526; --berry:#4C68D2;
  --z-frigo:#E2F1E7; --z-freezer:#E3EAFB; --z-dispensa:#F6EBD3;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 20px -12px rgba(60,40,20,.28);
  --f-display:"Fredoka","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  --emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130F; --card:#231D18; --ink:#F6EFE7; --muted:#B6A899; --line:#382F27; --line-strong:#56493D;
  --tomato:#FF6A4D; --basil:#5ECB8C; --lemon:#F4CB48; --orange:#FFA04A; --berry:#8FA6F6;
  --z-frigo:#1B2C22; --z-freezer:#1D2437; --z-dispensa:#33291A; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --card:#231D18; --ink:#F6EFE7; --muted:#B6A899; --line:#382F27; --line-strong:#56493D;
  --tomato:#FF6A4D; --basil:#5ECB8C; --lemon:#F4CB48; --orange:#FFA04A; --berry:#8FA6F6;
  --z-frigo:#1B2C22; --z-freezer:#1D2437; --z-dispensa:#33291A; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
:root{--acc-soft:color-mix(in srgb,var(--acc) 16%,var(--card));--acc-tint:color-mix(in srgb,var(--acc) 9%,var(--bg))}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.emo{font-family:var(--emo);line-height:1;font-weight:400}
.app{max-width:560px;margin:0 auto;padding-bottom:150px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.15}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h small{color:var(--muted);font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.hello{min-width:0}
.hello small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.hello h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello h1 b{color:var(--acc);font-weight:600}
.top-r{display:flex;gap:8px;align-items:center;flex:none}
.avatar{border:0;width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:24px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.avatar .caret{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);font-size:11px;display:grid;place-items:center;box-shadow:var(--shadow);font-family:var(--f-body);font-weight:800}
.menu{position:fixed;z-index:40;right:max(16px,calc(50% - 264px));top:calc(70px + env(safe-area-inset-top,0px));width:min(290px,calc(100% - 32px));background:var(--card);border-radius:22px;box-shadow:0 20px 50px -15px rgba(40,20,10,.45);padding:8px;animation:pop .16s ease-out;transform-origin:top right}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.menu .me{display:flex;gap:10px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .me .emo{font-size:30px}
.menu .me b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px}
.menu .me small{color:var(--muted);font-weight:700;font-size:12px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:14px;font-weight:700;text-align:left;font-size:15px}
.menu button:hover,.menu button:focus-visible{background:var(--acc-tint)}
.menu button .emo{font-size:20px;width:26px;text-align:center}
.menu-scrim{position:fixed;inset:0;z-index:39}

.banner{margin-top:4px;font-size:14px;background:var(--acc-soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;white-space:nowrap}
.view{display:flex;flex-direction:column;gap:20px;padding-top:10px}

/* mascotte */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:28px;padding:14px 16px;box-shadow:var(--shadow)}
.hero svg{width:66px;height:82px;flex:none}
.hero b{font-family:var(--f-display);font-weight:600;font-size:19px;display:block;line-height:1.15}
.hero p{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.hero .stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pillx{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--st,var(--muted)) 14%,var(--card));color:var(--st,var(--muted));white-space:nowrap}
.eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bob{animation:bob2 3.2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* urgenze */
.urgent{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 8px}
.urgent::-webkit-scrollbar{display:none}
.ucard{flex:none;width:124px;background:var(--card);border:0;border-radius:22px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ucard .emo{font-size:34px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--st) 15%,var(--card))}
.ucard b{font-weight:800;line-height:1.2;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
.when{display:inline-block;font-size:12px;font-weight:800;color:var(--st);background:color-mix(in srgb,var(--st) 14%,var(--card));border-radius:999px;padding:3px 9px;white-space:nowrap}
.cta{display:flex;align-items:center;gap:14px;background:var(--acc);color:var(--on-acc);border-radius:26px;padding:16px;border:0;width:100%;text-align:left;box-shadow:0 12px 24px -14px var(--acc)}
.cta .emo{font-size:38px;width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.cta b{font-family:var(--f-display);font-weight:600;font-size:19px;display:block;line-height:1.15}
.cta small{opacity:.92;font-size:14px;font-weight:700}
.cta span{flex:1;min-width:0}
.cta i{font-style:normal;font-size:26px}

/* filtri a tendina */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.filters::-webkit-scrollbar{display:none}
.filters>*{flex:none;white-space:nowrap}
.dd{position:relative;flex:none;display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.dd select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:10px 32px 10px 14px;font-weight:800;font-size:14px;max-width:62vw;cursor:pointer}
.dd::after{content:"▾";position:absolute;right:13px;pointer-events:none;color:var(--acc);font-size:13px}
.dd.on{background:var(--acc);color:var(--on-acc)}
.dd.on::after{color:var(--on-acc)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none}
.search .emo{font-size:18px}

.zone{border-radius:28px;padding:14px;background:var(--zt)}
.zone-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.zone-h h2{display:flex;align-items:center;gap:8px;font-size:19px}
.zone-h small{font-size:13px;font-weight:800;color:var(--muted);background:var(--card);border-radius:999px;padding:3px 10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:0;border-radius:22px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0;animation:rise .25s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.tile .tr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .emo{font-size:30px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--st) 14%,var(--card))}
.tile .q{font-size:12px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-weight:800;font-size:15px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .op{font-size:11px;font-weight:800;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:18px;text-align:center;border:2px dashed var(--line-strong);border-radius:22px;font-weight:600}

/* segment */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

/* chef card */
.chefcard{border:0;width:100%;text-align:left;border-radius:28px;padding:16px;background:linear-gradient(135deg,var(--acc-soft),color-mix(in srgb,var(--lemon) 18%,var(--card)));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.chefcard .row1{display:flex;gap:12px;align-items:center}
.chefcard .av{font-size:40px;width:64px;height:64px;border-radius:22px;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.chefcard b{font-family:var(--f-display);font-weight:600;font-size:20px;display:block;line-height:1.1}
.chefcard small{font-size:14px;color:var(--muted);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--card);color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--live,var(--line-strong))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.chip{border:0;background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

/* ricette */
.recipe{background:var(--card);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.recipe.top1{box-shadow:0 0 0 3px var(--acc),var(--shadow)}
.r-h{display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.r-h .emo{font-size:34px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--acc-tint);flex:none}
.r-h h3{font-size:18px}
.r-h small{color:var(--muted);font-size:13px;font-weight:700}
.pick{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px 4px 6px;background:color-mix(in srgb,var(--st) 13%,var(--card));display:inline-flex;align-items:center;gap:5px}
.pill.miss{background:none;border:2px dashed var(--line-strong);color:var(--muted);padding:3px 10px}
.pill.staple{background:var(--bg);color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--bg);border-radius:16px;padding:12px 16px;font-weight:800;font-size:15px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.basil{background:color-mix(in srgb,var(--basil) 15%,var(--card));color:var(--basil)}
.btn.danger{background:color-mix(in srgb,var(--tomato) 14%,var(--card));color:var(--tomato)}
.btn.berry{background:color-mix(in srgb,var(--berry) 15%,var(--card));color:var(--berry)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:14px}
.btn.wide{width:100%}
.iconbtn{border:0;background:var(--bg);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;width:100%}
.rrow .emo{font-size:28px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--acc-tint)}
.rrow b{display:block;font-weight:800;line-height:1.2}
.rrow small{color:var(--muted);font-size:13px;font-weight:700}
.have{font-size:12px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap}
.have.ok{background:color-mix(in srgb,var(--basil) 16%,var(--card));color:var(--basil)}
.have.mid{background:color-mix(in srgb,var(--lemon) 20%,var(--card));color:color-mix(in srgb,var(--lemon) 70%,var(--ink))}
.have.no{background:var(--bg);color:var(--muted)}

/* dettaglio ricetta */
.rd-head{display:flex;gap:14px;align-items:center}
.rd-head .emo{font-size:46px;width:78px;height:78px;border-radius:24px;display:grid;place-items:center;background:var(--acc-soft);flex:none}
.rd-head h2{font-size:24px}
.ing{display:flex;flex-direction:column;gap:6px}
.ing li{list-style:none;display:flex;gap:10px;align-items:center;font-weight:700}
.ing ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ok-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;font-weight:800}
.ok-dot.y{background:color-mix(in srgb,var(--basil) 18%,var(--card));color:var(--basil)}
.ok-dot.n{background:color-mix(in srgb,var(--tomato) 14%,var(--card));color:var(--tomato)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.doses{margin:0;padding-left:18px}
.doses li{margin:3px 0}
.stepper{display:inline-flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);overflow:hidden}
.stepper button{border:0;background:none;width:40px;height:38px;font-size:20px;font-weight:800;color:var(--acc)}
.stepper span,.stepper input{min-width:44px;text-align:center;font-weight:800;border:0!important;background:none!important;width:56px;padding:0!important}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}

/* spesa */
.shoplist{background:var(--card);border-radius:24px;padding:4px 14px;box-shadow:var(--shadow)}
.aisle{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 0 2px}
.shop{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop input[type=checkbox]{width:26px;height:26px;accent-color:var(--basil);flex:none}
.shop .emo{font-size:24px}
.shop label{flex:1;min-width:0;font-weight:700}
.shop.done label{text-decoration:line-through;color:var(--muted)}
.shop .x{border:0;background:none;color:var(--muted);font-size:22px;padding:0 4px}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0;border:0;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}

/* diario */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis>div{background:var(--card);border-radius:20px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.kpis .v{font-family:var(--f-display);font-weight:600;font-size:24px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:14px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{background:var(--bg);border-radius:18px;padding:10px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .emo{font-size:28px;filter:grayscale(1);opacity:.4}
.badge.got{background:var(--acc-tint);color:var(--ink)}
.badge.got .emo{filter:none;opacity:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--line)}
.bars .stack i{display:block}
.bars small{font-size:11px;color:var(--muted);font-weight:700}

/* form */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--basil);flex:none}
textarea.paste{min-height:80px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  const blocked=new Set([...(S.dislikes||[]),...dietBlocked()]);
  MCACHE={have,staple,blocked};return MCACHE}
function evalRecipe(r,c=ctx()){
  const bl=k=>c.blocked.has(k);const ok=k=>!bl(k)&&!!(c.have[k]||c.staple.has(k));
  const o={r,blocked:r.need.some(bl),miss:0,missing:[],used:[],score:0,req:r.need.length,got:0};
  const groups=r.any.map(g=>({keys:g.keys.filter(k=>!bl(k)),min:g.min}));
  if(groups.some(g=>g.keys.length<g.min))o.blocked=true;
  const mn=r.need.filter(k=>!ok(k));o.missing=mn.map(k=>({k}));o.got=r.need.length-mn.length;o.miss=mn.length;
  const gh=[];for(const g of groups){const h=g.keys.filter(ok);o.req+=g.min;o.got+=Math.min(g.min,h.length);if(h.length<g.min){o.missing.push({any:g.keys.filter(k=>!ok(k)).slice(0,4),n:g.min-h.length});o.miss+=g.min-h.length}gh.push(...h)}
  o.used=[...new Set([...r.need.filter(ok),...gh,...r.opt.filter(k=>!bl(k)&&c.have[k])])];
  const core=new Set([...r.need,...groups.flatMap(g=>g.keys)]);
  o.score=o.used.reduce((s,k)=>s+(c.have[k]?c.have[k].u*(core.has(k)?1:.5):0),0)+(S.favs.includes(r.n)?3:0);
  o.fridge=o.used.some(k=>c.have[k]);o.hidden=S.hidden.includes(r.n);return o}

function rDiario(){
  const el=$('#v-diario');const n=new Date();const p=ymd(n).slice(0,7);

  const tot=eaten+wasted.length,rate=tot?Math.round(wasted.length/tot*100):0,val=wasted.reduce((s,l)=>s+(l.price||0),0);
  const lastW=S.log.filter(l=>l.out==='wasted').map(l=>l.date).sort().pop();
  const first=S.log.map(l=>l.date).sort()[0];
  const streak=lastW?diffDays(lastW,today()):first?diffDays(first,today()):0;
  const cookedN=S.cooked.length;
  const weeks=[];for(let w=5;w>=0;w--){const end=addDays(today(),-7*w),start=addDays(end,-6);const L=S.log.filter(l=>l.date>=start&&l.date<=end);weeks.push({e:L.filter(l=>l.out==='eaten').length,w:L.filter(l=>l.out==='wasted').length,lbl:fmtDate(start)})}
  const mx=Math.max(1,...weeks.map(w=>w.e+w.w));
  const B=[['🥇','Prima ricetta',cookedN>=1],['👨‍🍳','Chef in erba',cookedN>=10],['🌱','7 giorni zero sprechi',streak>=7&&S.log.length>0],['🏆','Mese virtuoso',tot>=10&&rate<=10],['♻️','Riciclone',S.cnt.recycle>=3],['❄️','Salvato dal gelo',S.cnt.freeze>=3],['🧺','Spesa ordinata',S.cnt.putaway>=3],['📷','Occhio di falco',S.cnt.scan>=1]];

  el.innerHTML=`<div><div class="label">${MONTHS[n.getMonth()]}</div><h2 style="font-size:24px;margin-top:2px">${mood} Il diario di ${esc(S.profile.name)}</h2></div>

  ${tot?`<div class="panel"><div class="meter"><i style="width:${100-rate}%;background:var(--basil)"></i><i style="width:${rate}%;background:var(--tomato)"></i></div><p class="note">Hai buttato il ${rate}% di quello che hai tolto dal frigo questo mese${val?', per un valore di '+fmt(val):''}. ${streak>=3?'Sono '+streak+' giorni senza sprechi: continua così!':''}</p></div>`:'<div class="empty">Quando togli un prodotto scegli "Mangiato" o "Buttato": qui vedrai i tuoi progressi.</div>'}
  <div class="panel"><div class="sec-h"><h2>Ultime 6 settimane</h2><small><span style="color:var(--basil)">■</span> mangiati <span style="color:var(--tomato)">■</span> buttati</small></div><div class="bars">${weeks.map(w=>`<div class="col"><div class="stack" style="height:${Math.max(4,(w.e+w.w)/mx*90)}px">${w.e?`<i style="height:${w.e/(w.e+w.w)*100}%;background:var(--basil)"></i>`:''}${w.w?`<i style="height:${w.w/(w.e+w.w)*100}%;background:var(--tomato)"></i>`:''}</div><small>${w.lbl}</small></div>`).join('')}</div></div>
  <div class="panel"><div class="sec-h"><h2>Medaglie</h2><small>${B.filter(b=>b[2]).length}/${B.length}</small></div><div class="badges">${B.map(([e,l,g])=>`<div class="badge ${g?'got':''}"><span class="emo">${e}</span>${l}</div>`).join('')}</div></div>
  ${S.cooked.length?`<div class="panel"><div class="sec-h"><h2>Ultimi piatti cucinati</h2><small>${cookedN} in tutto</small></div><div class="rlist">${S.cooked.slice(-5).reverse().map(c=>{const r=RBYNAME[c.n];return r?`<button class="rrow" data-openr="${r.id}" style="box-shadow:none;background:var(--bg)"><span class="emo">${REMO(r)}</span><span style="min-width:0"><b>${esc(r.n)}</b><small>${fmtDate(c.d)}</small></span><span></span></button>`:''}).join('')}</div></div>`:''}
  ${worst.length?`<div class="panel"><div class="sec-h"><h2>Cosa butti più spesso</h2></div><div>${worst.map(([nm,o])=>`<div class="shop"><span class="emo">${o.k&&CAT[o.k]?CAT[o.k].e:'🍽️'}</span><label>${esc(nm)}</label><b style="color:var(--tomato)">${o.c}×</b></div>`).join('')}</div><p class="note">Compra queste cose in confezioni più piccole o mettile in freezer appena arrivano.</p></div>`:''}`;

      p.querySelector('#iEmo').textContent=c.e;p.querySelector('#iHint').textContent='Scadenza indicativa: '+c.d+' giorni'+(c.o?', '+c.o+' dopo l\'apertura':'')+'. Correggila con la data sulla confezione.';

    if(grid){drawGrid();
      nameIn.addEventListener('input',()=>{SS.k=null;p.querySelector('#iEmo').textContent='🍽️';drawGrid()});
      p.querySelector('#iGroups').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;SS.group=b.dataset.g;if(!SS.k)nameIn.value='';p.querySelectorAll('#iGroups .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));drawGrid()});

      if(o==='freeze'){S.items[i].zone='freezer';S.items[i].exp=addDays(t,90);S.items[i].opened=null;S.cnt.freeze++;save();closeSheet();render();popFx('❄️');toast('❄️ '+it.name+' in freezer per 3 mesi',()=>{S.items[i]=old;S.cnt.freeze--;save();render()});return}

function chefRules(){const P=persona(),pr=S.profile;
  return `Sei "${P.n}", ${P.style}. Parli con ${pr.name}, nell'app "Dispensa" che tiene l'inventario di frigo, freezer e dispensa.
Conosci a fondo la cucina italiana e internazionale: ricette regionali e classiche, tecniche, tempi e temperature, dosi, sostituzioni, conservazione, sicurezza alimentare e abbinamenti con il vino.
Regole:
- Rispondi in italiano, per lo schermo di un telefono: frasi brevi, niente tabelle né titoli con #.
- Quando proponi piatti: al massimo 3, ciascuno con il nome in **grassetto**, tempo, ingredienti presi dall'inventario, "manca:" per ciò che va comprato (meglio se nulla), poi i passaggi essenziali con le dosi per ${pr.people} ${pr.people===1?'persona':'persone'}.
- Se chiede una ricetta precisa, dalla completa: ingredienti con dosi e procedimento numerato.
- Dai priorità a ciò che scade prima e dillo.

- Usa elenchi con "- " o "1." e il grassetto con **testo**.`}
function kitchenContext(){

  const n=new Date();

${lines.join('\n')||'(vuoto)'}

function modeLabel(){const m=chefMode();return m==='claude'?['Online · Claude','var(--basil)']:m==='api'?['Online · IA','var(--basil)']:['Offline · ricettario','var(--lemon)']}

function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function shrink(file){try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82))}catch(e){return file}}
function cleanTurns(turns){const out=[];for(const t0 of turns){if(!t0.content)continue;const t={role:t0.role,content:t0.content+(t0.recipes&&t0.recipes.length?'\n[Schede ricetta mostrate: '+t0.recipes.map(i=>RECIPES[i]&&RECIPES[i].n).join(', ')+']':'')};
  if(!out.length&&t.role!=='user')continue;if(out.length&&out[out.length-1].role===t.role)out[out.length-1].content+='\n\n'+t.content;else out.push(t)}
  while(out.length&&out[out.length-1].role!=='user')out.pop();return out.slice(-14)}
async function apiCall(system,messages,images){
  const msgs=messages.map(m=>({role:m.role,content:m.content}));
  if(images&&images.length){const last=msgs[msgs.length-1];last.content=[...(await Promise.all(images.map(toB64))).map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:last.content}]}
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.ai.model||DEFAULT_MODEL,max_tokens:1600,system,messages:msgs})});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw{code:r.status===401?'bad_key':r.status===429?'rate_limited':r.status===400?'bad_request':'upstream_error',message:(j&&j.error&&j.error.message)||('Errore '+r.status)};
  const text=((j&&j.content)||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();if(!text)throw{code:'empty_completion'};return text}
async function askAI(turns,{images,onText,signal}={}){
  const mode=chefMode();const sys=chefRules()+'\n\n'+kitchenContext();const clean=cleanTurns(turns);if(!clean.length)throw{code:'invalid_request'};
  if(mode==='claude'){const r=await SAMPLE([{role:'user',content:sys+'\n\nOra rispondi alla conversazione.'},...clean],{cache:false,onText,signal,images});return r.text}
  if(mode==='api'){const t=await apiCall(sys,clean,images);onText&&onText({text:t});return t}
  throw{code:'offline'}}
function parseJSONLoose(t){try{return JSON.parse(t)}catch(e){}const a=t.indexOf('['),b=t.lastIndexOf(']');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}return null}
async function askJSON(prompt,images){const mode=chefMode();
  if(mode==='claude')return await SAMPLE.json(prompt,{images});
  if(mode==='api'){const t=await apiCall('Rispondi solo con JSON valido, senza altro testo.',[{role:'user',content:prompt}],images);const j=parseJSONLoose(t);if(!j)throw{code:'invalid_json'};return j}
  throw{code:'offline'}}
const errText=e=>{const c=e&&e.code;return c==='bad_key'?'La chiave API non è valida: controllala nel menu, in Chef e IA.':c==='rate_limited'?'Troppe richieste o credito esaurito. Riprova tra poco.':c==='not_granted'?'Non hai autorizzato l\'uso di Claude in questa pagina.':c==='offline'?'Sono offline.':'Non riesco a raggiungere l\'IA in questo momento.'};

 [/(pesce fresco|riconoscere.*pesce|pesce.*fresco)/,'Pesce fresco: occhio vivo e lucido, branchie rosso vivo, carne soda che torna su se premuta, odore di mare e non di pesce.'],

function findRecipeByName(text){const st=new Set(tokens(text).map(stem));let best=null;
  for(const r of RECIPES){if(!r.tk.length)continue;const m=r.tk.filter(w=>st.has(w)).length;if(!m)continue;const ratio=m/r.tk.length;
    if(ratio===1||(m>=2&&ratio>=.66)){const sc=ratio*10+m;if(!best||sc>best.sc)best={r,sc,full:ratio===1}}}return best}
function winePair(keys,r){const ks=new Set(keys.map(famOf));if(r){r.need.forEach(k=>ks.add(k));r.any.forEach(g=>g.keys.forEach(k=>ks.add(k)))}
  const has=list=>list.some(k=>ks.has(k));
  if(r&&(r.c==='dol'))return 'Con il dolce un vino dolce: Moscato d\'Asti con i dolci alla frutta, Passito di Pantelleria o Marsala con dolci secchi e cioccolato.';
  if(r&&r.c==='piz')return 'Con la pizza va benissimo una birra chiara, oppure un Lambrusco o un Gragnano frizzante.';
  if(has(['pesce','salmone','tonno_fresco','pesce_spada','gamberi','cozze','vongole','calamari','polpo','alici','baccala']))return 'Con il pesce un bianco fresco e sapido: Vermentino, Grillo, Falanghina o Verdicchio. Con salmone e tonno anche un rosato.';
  if(has(['manzo','agnello','salsiccia','costine','macinato','maiale']))return 'Con la carne rossa un rosso strutturato: Nero d\'Avola, Chianti Classico, Montepulciano d\'Abruzzo o Aglianico.';
  if(has(['pollo','tacchino','vitello','coniglio']))return 'Con le carni bianche un rosso leggero o un rosato: Bardolino, Cerasuolo d\'Abruzzo, Frappato.';
  if(has(EXP.formaggio))return 'Con i formaggi freschi un bianco giovane; con quelli stagionati un rosso importante o un passito, soprattutto con gli erborinati.';
  return 'Regola d\'oro: abbina per intensità. Piatti delicati con bianchi freschi, sughi di pomodoro con rossi giovani (Chianti, Barbera), piatti ricchi con rossi strutturati. Dimmi il piatto e ti dico il vino preciso.'}
function planWeek(){const P=persona();
  const all=RECIPES.map(r=>evalRecipe(r)).filter(x=>!x.blocked&&!x.hidden&&['pri','sec','uni','zup','piz'].includes(x.r.c));
  all.sort((a,b)=>a.miss-b.miss||b.score-a.score);
  const pick=[];let last=null;for(const x of all){if(pick.length>=7)break;if(x.r.c===last&&all.length>14)continue;if(x.miss>2)continue;pick.push(x);last=x.r.c}
  const d0=new Date().getDay();const DN=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const lines=pick.map((x,i)=>`- **${DN[(d0+i)%7]}**: ${x.r.n}${x.miss?' (manca '+x.missing.map(missingText).join(', ')+')':' ✓'}`);
  return{text:`${P.intro}, il menu dei prossimi ${pick.length} giorni, partendo da ciò che scade prima:\n${lines.join('\n')}`,recipes:pick.slice(0,3).map(x=>x.r.id),acts:pick.some(x=>x.miss)?[{t:'addmiss',ids:pick.map(x=>x.r.id),l:'🛒 Metti in spesa ciò che manca'}]:null}}
function chefOffline(text){
  const P=persona();const t=norm(text);const name=S.profile.name;
  const out=(txt,ids=[],acts=null)=>({text:txt,recipes:ids,acts});
  if(/^(ciao|buongiorno|buonasera|salve|hey|ehi|hola)\b/.test(t)&&t.length<30){const s=suggestions();return out(`${P.hello}, ${name}! Dimmi cosa ti va, cosa non ti piace o cosa vuoi smaltire.`+(s.ready.length?' Intanto ti propongo:':''),s.ready.slice(0,2).map(x=>x.r.id))}
  if(/^(grazie|perfetto|ottimo|top|fantastico)\b/.test(t)&&t.length<35)return out(P.bye);
  const ks=keysIn(text);const fam=[...new Set(ks.map(famOf))];
  if(/(non mi piac|non mi va|odio|non mangio|non sopporto|detesto|allergic|intolleran|non voglio)/.test(t)&&fam.length&&!/\b(piatto|ricetta)\b/.test(t)){
    S.dislikes=[...new Set([...S.dislikes,...fam])];save();const s=suggestions();
    return out(`Segnato: niente ${fam.map(k=>kName(k).toLowerCase()).join(', ')} 👍 Non te lo propongo più (lo cambi dal menu, in Non graditi). ${s.ready.length?'Ecco invece:':'Con il resto non trovo ricette complete, chiedimi pure qualcosa di preciso.'}`,s.ready.slice(0,3).map(x=>x.r.id))}
  if(/(menu|settiman|pianific|programma dei pasti|cosa mangio questa)/.test(t))return planWeek();
  if(/(scad|da finire|da usare|smaltir|sprec|salvare)/.test(t)&&!fam.length){const urg=S.items.filter(i=>{const d=daysLeft(i);return d!==null&&d<=3}).sort(sortItems);const s=suggestions();
    return out(urg.length?`Da usare per primi: ${urg.slice(0,6).map(i=>emoOf(i)+' '+i.name.toLowerCase()+' ('+status(daysLeft(i),i.zone).t+')').join(', ')}. ${P.intro}:`:'Niente in scadenza nei prossimi giorni 🌱 Ecco comunque qualche idea:',s.ready.slice(0,3).map(x=>x.r.id))}
  const byName=findRecipeByName(text);
  if(/(vino|abbin|cosa bevo|bere)/.test(t))return out('🍷 '+winePair(ks,byName&&byName.r));
  const asks=/(come si fa|come faccio|come preparo|ricetta|procedimento|dosi|preparare|come si cucina|insegnami|spiegami)/.test(t);
  if(byName&&(asks||byName.full)){const e=evalRecipe(byName.r);const ppl=S.profile.people;
    return out(`**${byName.r.n}**, ⏱ ${byName.r.t} minuti. ${e.miss?'Ti manca: '+e.missing.map(missingText).join(', ')+'.':'Hai già tutto quello che serve!'} Nella scheda trovi dosi per ${ppl} e procedimento passo passo.`,[byName.r.id],e.miss?[{t:'addmiss',ids:[byName.r.id],l:'🛒 Aggiungi ciò che manca'}]:null)}
  for(const[re,ans]of TECH)if(re.test(t))return out(`${P.tip}: ${ans}`);
  if(/(sostitu|al posto|invece d|non ho |mi manca|manca |finit)/.test(t)&&fam.length){const k=fam.find(x=>SUBS[x]);if(k)return out(`Al posto di ${kName(k).toLowerCase()} puoi usare ${SUBS[k]}.`)}
  if(/(conserv|quanto dura|durata|congel|si mantiene|tenere|mantenere|dove metto)/.test(t)&&ks.length){const k=ks[0],c=CAT[k];const tip=TIPS[famOf(k)]||TIPS[k];
    return out(`${c.e} **${c.n}**: in ${ZONES[c.z].toLowerCase()} dura circa ${c.d} giorni${c.o?', '+c.o+' una volta aperto':''}. ${tip||'Controlla sempre la data sulla confezione.'}${c.z==='frigo'&&c.d<=7?' In freezer resiste circa 3 mesi.':''}`)}
  // filtri combinati
  const COURSE_W=[[/antipast|aperitiv|stuzzich/,'ant'],[/\bprim[oi]\b/,'pri'],[/\bsecond[oi]\b/,'sec'],[/contorn/,'con'],[/zupp|minestr|vellutat|qualcosa di caldo/,'zup'],[/piatto unico|piatti unici/,'uni'],[/pizz|torta salata|focacc|piadin/,'piz'],[/dolc|dessert|torta(?! salata)|biscott|goloso/,'dol'],[/colazion|merend|brunch/,'col'],[/\bsals[ae]\b|condiment/,'sal']];
  const course=(COURSE_W.find(([re])=>re.test(t))||[])[1];
  const tags=[];if(/(veloc|rapid|fretta|poco tempo|10 min|15 min|subito|al volo)/.test(t))tags.push('q');if(/(legger|light|dieta|sano|sana|poche calorie|cena leggera)/.test(t))tags.push('l');if(/(al forno|forno)/.test(t))tags.push('f');if(/(avanz|ricicl|svuota)/.test(t))tags.push('r');
  const veg=/(vegetarian|senza carne|veg\b|vegan)/.test(t),vegan=/vegan/.test(t);
  const meat=/(\bdi carne\b|\bcarne\b)/.test(t)&&!veg,fish=/(\bdi pesce\b|\bpesce\b|frutti di mare)/.test(t)&&!veg;
  const ingr=fam.filter(k=>!(meat&&k==='pesce'));
  const any=course||tags.length||veg||meat||fish||ingr.length;
  if(any){
    const extra=new Set();if(veg){MEAT.forEach(k=>extra.add(k));FISH.forEach(k=>extra.add(k))}if(vegan)ANIMAL.forEach(k=>extra.add(k));
    const base=ctx();const c2=extra.size?{...base,blocked:new Set([...base.blocked,...extra])}:base;
    let list=RECIPES.filter(r=>(!course||r.c===course)&&tags.every(g=>r.tags.has(g))).map(r=>evalRecipe(r,c2)).filter(e=>!e.blocked&&!e.hidden);
    const core=r=>[...r.need,...r.any.flatMap(g=>g.keys)];
    if(meat)list=list.filter(e=>core(e.r).some(k=>MEAT.has(k)));
    if(fish)list=list.filter(e=>core(e.r).some(k=>FISH.has(k)));
    if(ingr.length){const w=list.map(e=>({e,h:ingr.filter(k=>core(e.r).includes(k)||e.r.opt.includes(k)).length})).filter(x=>x.h>0);w.sort((a,b)=>b.h-a.h||a.e.miss-b.e.miss||b.e.score-a.e.score);list=w.map(x=>x.e)}
    else list.sort((a,b)=>a.miss-b.miss||b.score-a.score);
    if(!list.length)return out(`Nel mio ricettario offline non trovo nulla di adatto.${chefMode()==='offline'?' Quando sei online posso inventare un piatto apposta per te.':''}`);
    const top=list.slice(0,3);const desc=[course&&COURSES[course][1].toLowerCase(),tags.includes('q')&&'veloci',tags.includes('l')&&'leggeri',tags.includes('f')&&'al forno',tags.includes('r')&&'anti-spreco',veg&&(vegan?'vegani':'vegetariani'),meat&&'di carne',fish&&'di pesce',ingr.length&&'con '+ingr.map(k=>kName(k).toLowerCase()).join(' e ')].filter(Boolean).join(', ');
    const tip=ingr.map(k=>TIPS[k]).find(Boolean);
    const allMiss=top.every(x=>x.miss);
    return out(`${P.intro}: piatti ${desc}${allMiss?'. Ti mancherebbe qualcosa, ma vale la pena':''}.${tip?`\n\n${P.tip}: ${tip}`:''}`,top.map(x=>x.r.id),top.some(x=>x.miss)?[{t:'addmiss',ids:top.filter(x=>x.miss).map(x=>x.r.id),l:'🛒 Aggiungi ciò che manca'}]:null)}
  const s=suggestions();
  return out((s.ready.length?`${P.intro}, partendo da ciò che scade prima:`:'Il frigo è un po\' vuoto per proporti qualcosa di completo.')+`\n\nPuoi chiedermi per esempio: "un primo veloce", "cosa faccio con le zucchine", "come si fa la carbonara", "come sostituisco la panna", "quanto dura la mozzarella", "menu della settimana", "che vino ci abbino".`,s.ready.slice(0,3).map(x=>x.r.id))}

function mdLite(s){const lines=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',ul=null;
  for(const l of lines){const m=l.match(/^\s*([-•*]|\d+[.)])\s+(.*)/);if(m){const tag=/\d/.test(m[1])?'ol':'ul';if(ul!==tag){if(ul)h+=`</${ul}>`;h+=`<${tag}>`;ul=tag}h+='<li>'+m[2]+'</li>'}else{if(ul){h+=`</${ul}>`;ul=null}if(l.trim())h+='<p>'+l.replace(/^#+\s*/,'')+'</p>'}}
  if(ul)h+=`</${ul}>`;return h}
function miniRec(i){const r=RECIPES[i];if(!r)return'';const e=evalRecipe(r);return `<button class="minirec" data-openr="${i}"><span class="emo">${REMO(r)}</span><span style="flex:1;min-width:0"><b>${esc(r.n)}</b><small>⏱ ${r.t} min · ${e.miss?'manca '+esc(e.missing.map(missingText).join(', ')):'hai tutto ✓'}</small></span><span>›</span></button>`}
function msgHTML(m,i){
  if(m.role==='user')return `<div class="msg me">${esc(m.content)}</div>`;

  return `<div class="msg chef">${mdLite(m.content)}${(m.recipes||[]).map(miniRec).join('')}${acts?`<div class="macts">${acts}</div>`:''}${m.src?`<span class="src">${m.src}</span>`:''}</div>`}
function renderChat(){const log=$('#chatLog');if(!log)return;const P=persona();
  log.innerHTML=S.chat.length?S.chat.map(msgHTML).join(''):`<div class="msg chef"><p>${P.hello}, <b>${esc(S.profile.name)}</b>! Sono <b>${P.n}</b> ${P.e}</p><p>So cosa c'è nel tuo frigo e cosa scade prima. Chiedimi un piatto, una ricetta precisa, un trucco, un vino, oppure dimmi cosa non ti va.</p></div>`;

function startScan(){

  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);
  inp.addEventListener('change',async()=>{const f=inp.files[0];inp.remove();if(!f)return;toast('📷 Sto guardando la foto…');
    try{const blob=await shrink(f);const keys=CATALOG.map(c=>c.k).join(', ');
      const res=await askJSON(`Nella foto c'è un frigorifero, una dispensa o uno scontrino della spesa. Elenca gli alimenti riconoscibili, esclusi i prodotti non alimentari. Rispondi solo con un array JSON di oggetti {"name": nome breve in italiano, "key": una di queste chiavi se corrisponde [${keys}] altrimenti null, "qty": numero o null, "unit": unità o null, "days": giorni di conservazione stimati da oggi o null}. Massimo 30 elementi.`,[blob]);
      const list=(Array.isArray(res)?res:[]).filter(o=>o&&o.name).slice(0,30);

   <div>${list.map((o,i)=>{const k=CAT[o.key]?o.key:guessKey(String(o.name));const c=CAT[k];const days=o.days!=null&&Number.isFinite(+o.days)?+o.days:(c?c.d:null);
     return `<div class="scanrow"><input type="checkbox" data-sc="${i}" checked aria-label="Aggiungi"><div style="display:flex;gap:8px;align-items:center;min-width:0"><span class="emo" style="font-size:24px">${c?c.e:'🍽️'}</span><input type="text" data-sn="${i}" value="${esc(o.name)}" aria-label="Nome"></div><input type="date" data-sd="${i}" value="${days!==null?addDays(t,Math.max(0,Math.round(days))):''}" aria-label="Scadenza"></div>`}).join('')}</div>
   <button class="btn acc wide" id="scDo">Aggiungi a casa</button>`,p=>{
    p.querySelector('#scDo').addEventListener('click',()=>{let n=0;
      list.forEach((o,i)=>{if(!p.querySelector(`[data-sc="${i}"]`).checked)return;const name=p.querySelector(`[data-sn="${i}"]`).value.trim();if(!name)return;
        const k=CAT[o.key]?o.key:guessKey(name);const c=CAT[k];
        S.items.push({id:uid(),k:k||null,name,zone:c?c.z:'frigo',qty:o.qty!=null?String(o.qty):(c&&c.u!=='g'?'1':''),unit:o.unit||(c?c.u:''),exp:p.querySelector(`[data-sd="${i}"]`).value||null,opened:null,openDays:c?c.o:null,added:t,price:null});n++});
      if(S.demo)S.demo=false;save();closeSheet();setTab('frigo');popFx('🧺');toast(n+' prodott'+(n===1?'o aggiunto':'i aggiunti'))})})}

/* ---------- esempi ---------- */
function seedDemo(){
  const keep={profile:S.profile,ai:S.ai,customFoods:S.customFoods};S={...blank(),...keep,demo:true};indexCatalog();const t=today();
  const add=(k,qty,expIn,extra={})=>{const c=CAT[k];S.items.push({id:uid(),k,name:c.n,zone:c.z,qty,unit:c.u,exp:addDays(t,expIn),opened:null,openDays:c.o,added:addDays(t,-2),price:null,...extra})};
  add('zucchine',3,1);add('uova',4,9);add('mozzarella',1,0,{price:150});add('pomodorini',250,3);add('latte',1,4,{opened:addDays(t,-1),price:139});
  add('pollo',400,1,{price:620});add('limoni',3,15);add('spinaci',200,2);add('ricotta',250,5);add('parmigiano',300,40);add('basilico',1,3);
  add('yogurt',2,11);add('banane',3,1);add('piselli',450,120);add('passata',1,200);add('tonno',2,500);add('insalata',1,-1,{price:129});add('salsiccia',300,2);add('patate',1,20);
  S.shop=[{id:uid(),name:'Pane',k:'pane',done:false},{id:uid(),name:'Caffè',k:'caffe',done:false},{id:uid(),name:'Mele',k:'mele',done:false}];
  const L=(k,o,d,p)=>S.log.push({k,name:kName(k),out:o,date:addDays(t,-d),price:p||null});
  L('insalata','wasted',5,129);L('latte','eaten',6);L('pollo','eaten',8);L('pane','wasted',12,180);L('zucchine','eaten',3);L('mozzarella','eaten',4);L('yogurt','eaten',2);L('banane','wasted',16,90);L('uova','eaten',9);L('spinaci','eaten',20);L('pomodori','eaten',24);
  S.cooked=[{n:'Frittata di zucchine',d:addDays(t,-3)},{n:'Pasta al pomodoro e basilico',d:addDays(t,-6)}];S.favs=['Carbonara'];
}

/* ---------- backup ---------- */
const backupJSON=()=>JSON.stringify({app:'dispensa',v:2,exported:new Date().toISOString(),data:{...S,ai:{key:'',model:(S.ai&&S.ai.model)||''},chat:[]}});
async function copyText(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(e){const ta=$('#bkPaste');if(ta){ta.value=txt;ta.focus();ta.select()}toast('Copia non consentita: il testo è selezionato qui sotto')}}
function restore(txt){try{const o=JSON.parse(txt);const d=o.data||o;if(!d||!Array.isArray(d.items))throw 0;const ai=S.ai;S=migrate(d);S.ai=ai;S.profile.onboarded=true;save();applyTheme();render();return'Ripristinati '+S.items.length+' prodotti.'}catch(e){return'Questo testo non è un backup valido di Dispensa.'}}

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabs [data-tab]');if(tb){setTab(tb.dataset.tab);return}
  if(e.target.closest('#plusBtn')){openItem(null);return}
  if(e.target.closest('#avatarBtn')){$('#menu')?closeMenu():openMenu();return}
  if(e.target.closest('#chefBub')){openChef(null);return}
  const it=e.target.closest('[data-item]');if(it){openItem(S.items.find(x=>x.id===it.dataset.item));return}
  const or=e.target.closest('[data-openr]');if(or){openRecipe(+or.dataset.openr);return}
  const my=e.target.closest('[data-myr]');if(my){openMyRecipe(my.dataset.myr);return}
  const cb=e.target.closest('[data-chef]');if(cb){openChef(cb.dataset.chef||null);return}
  const ck=e.target.closest('[data-cook]');if(ck){openCook(+ck.dataset.cook);return}
  const np=e.target.closest('[data-nope]');if(np){openNope(+np.dataset.nope);return}
  const am=e.target.closest('[data-addmiss]');if(am){const n=addMissingToShop([+am.dataset.addmiss]);render();toast(n?'🛒 Aggiunto alla spesa':'Già nella lista');return}
  const cs=e.target.closest('[data-cseg]');if(cs){V.cseg=cs.dataset.cseg;rCucina();return}
  const rt=e.target.closest('[data-rt]');if(rt){const k=rt.dataset.rt;V.rt.has(k)?V.rt.delete(k):V.rt.add(k);rt.setAttribute('aria-pressed',V.rt.has(k));V.rlim=40;rList();return}
  const sg=e.target.closest('[data-sugg]');if(sg){const n=sg.dataset.sugg;S.shop.push({id:uid(),name:n,k:guessKey(n),done:false});save();render();return}
  const ds=e.target.closest('[data-delshop]');if(ds){S.shop=S.shop.filter(s=>s.id!==ds.dataset.delshop);save();render();return}
  const id=e.target.closest('button')?.id;
  if(id==='rMore'){V.rlim+=40;rList()}
  if(id==='putAway')putAway();
  if(id==='clearDone'){S.shop=S.shop.filter(s=>!s.done);save();render()}
  if(id==='demoClear'){const keep={profile:S.profile,ai:S.ai,customFoods:S.customFoods};S={...blank(),...keep};save();render();toast('Pronto: aggiungi quello che hai con +')}
  if(id==='bkCopy')copyText(backupJSON(),'Backup copiato. Incollalo in Note o File.');
  if(id==='bkShare'){const name='dispensa-'+today()+'.json';const blob=new Blob([backupJSON()],{type:'application/json'});let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(er){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'Backup Dispensa'}).catch(()=>{});else copyText(backupJSON(),'Backup copiato. Incollalo in Note o File.')}
  if(id==='bkRestore'){const v=$('#bkPaste').value.trim();$('#bkMsg').textContent=v?restore(v):'Incolla prima il testo del backup.'}
  if(id==='resetBtn'){const b=e.target.closest('button');if(b.dataset.armed){const keep={profile:S.profile,ai:S.ai};S={...blank(),...keep};save();closeSheet();render();toast('Dati cancellati')}else{b.dataset.armed=1;b.textContent='Tocca di nuovo per confermare'}}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='fZone'){V.zone=e.target.value;rFrigo();return}
  if(id==='fGrp'){V.grp=e.target.value;rFrigo();return}
  if(id==='fSort'){V.sort=e.target.value;rZones();return}
  if(id==='rC'){V.rc=e.target.value;V.rlim=40;e.target.parentElement.classList.toggle('on',V.rc!=='all');rList();return}
  if(e.target.dataset&&e.target.dataset.shop){const s=S.shop.find(x=>x.id===e.target.dataset.shop);if(s){s.done=e.target.checked;save();render()}}
  if(id==='bkFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bkMsg').textContent=restore(r.result)};r.readAsText(f)}
});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){V.q=e.target.value;rZones()}if(e.target.id==='rQ'){V.rq=e.target.value;V.rlim=40;rList()}});
document.addEventListener('submit',e=>{if(e.target.id==='shopForm'){e.preventDefault();const v=$('#shopIn').value.trim();if(!v)return;S.shop.push({id:uid(),name:v,k:guessKey(v),done:false});save();render();setTimeout(()=>{const i=$('#shopIn');i&&i.focus()},0)}});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#menu')){closeMenu();return}if(!$('#sheet').hidden){closeSheet();return}if($('#chat'))closeChef()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
window.addEventListener('online',()=>{paintMode()});window.addEventListener('offline',()=>{paintMode()});

/* ---------- avvio ---------- */
(function boot(){
  const o=load();S=o?migrate(o):blank();
  if(o&&o.items&&o.items.length&&!o.profile)S.profile.onboarded=false;
  indexCatalog();applyTheme();
  render();
  if(!S.profile.onboarded)openWelcome(false);
  const b=$('#chefBub');const sp=document.createElement('span');sp.className='bubble';sp.textContent=persona().bub;b.appendChild(sp);setTimeout(()=>sp.remove(),6500);
  if(window.claude&&window.claude.use){window.claude.use('sample').then(s=>{SAMPLE=s||null;paintMode()}).catch(()=>{})}
  if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();

})();
</script>
